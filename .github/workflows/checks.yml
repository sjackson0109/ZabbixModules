name: Checks

on:
  push:
    branches: [work, main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python templates/generate_lab.py --check
      - run: python scripts/sync_widget_assets.py --check

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/browser/widgets.test.cjs

  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ["8.0", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: find frontend tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/php/run.php
