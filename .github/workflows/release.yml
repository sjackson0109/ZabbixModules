name: Release

# Publish a GitHub release either by pushing a vX.Y.Z tag on a commit of the default
# branch, or by running this workflow on the default branch with the version (Actions >
# Release > Run workflow), which tags the branch head itself. See docs/operations/RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching the VERSION file (for example 1.2.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches VERSION, components and changelog
        run: python scripts/release.py check "$TAG"
      - name: Tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
            || { echo "::error::$TAG is not on $DEFAULT_BRANCH"; exit 1; }
      - name: Tag is new (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; release a new version or delete the tag first"; exit 1
          fi

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  # Real Zabbix 7.0, 7.2 and 7.4 labs; nothing is published unless all three pass.
  compatibility:
    needs: verify
    uses: ./.github/workflows/compatibility.yml

  publish:
    needs: [checks, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: id-token signs through Sigstore, attestations stores the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generated files are current
        run: |
          python -m pip install -r requirements-dev.txt
          python templates/generate_snmp.py --check
          python templates/generate_lab.py --check
          python scripts/sync_widget_assets.py --check
      - name: Build packages
        run: |
          python scripts/package.py --output dist
          cd dist && sha256sum -c SHA256SUMS
      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar
            dist/manifest.json
      - name: Release notes
        run: |
          version="${TAG#v}"
          {
            python scripts/release.py notes "$version"
            echo
            echo "## Install"
            echo
            echo "Download the archives below and check them with \`sha256sum -c SHA256SUMS\`. Each archive also carries a signed build-provenance attestation: \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`. Install the frontend and template packages together, following [INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/operations/INSTALL.md) or the [deployment guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/operations/DEPLOYMENT_GUIDE.md)."
          } > dist/RELEASE_NOTES.md
      - name: Tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Simon Jackson"
          git config user.email "simon@jacksonfamily.me"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Network Explorer ${TAG#v}"
          git push origin "refs/tags/$TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag "${flags[@]}" \
            --title "Network Explorer $version" --notes-file dist/RELEASE_NOTES.md \
            dist/*.tar dist/manifest.json dist/SHA256SUMS
