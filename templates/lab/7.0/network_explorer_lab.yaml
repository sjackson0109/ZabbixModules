          identity';seen[r.uid]=true;}var rows=e.data.map(function(r){var x=JSON.parse(JSON.stringify(r));x.name=x.name||x.description||x.uid;return
          x;});return JSON.stringify(rows);
        error_handler: DISCARD_VALUE
      lld_macro_paths:
      - lld_macro: '{#IFUID}'
        path: $.uid
      - lld_macro: '{#IFNAME}'
        path: $.name
      - lld_macro: '{#IFINDEX}'
        path: $.if_index
      item_prototypes:
      - uuid: 47b64181d1f3460f9e3c663532dea0b1
        name: 'LAB {#IFNAME}: operational status'
        type: DEPENDENT
        key: ne.if.oper[{#IFUID}]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        trends: '0'
        tags:
        - tag: component
          value: network-explorer
        - tag: dataset
          value: interfaces
        - tag: data_source
          value: lab-replay
        - tag: interface_uid
          value: '{#IFUID}'
        master_item:
          key: ne.interfaces.state
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var e=JSON.parse(value),a=e.data; for(var i=0;i<a.length;i++){if(a[i].uid===''{#IFUID}''){var v=a[i][''oper_status''];if(v===null||v===undefined){throw
            ''Unknown scalar'';}if(typeof v===''string''){var m={"up": 1, "down": 2, "testing": 3, "unknown": 4,
