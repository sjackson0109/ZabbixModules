          - tag: dataset
            value: poe
          - tag: data_source
            value: native-snmp
      - uuid: b69eb3d5f53b47c4bdf0c42b3102331e
        name: 'PoE port {#POENAME}: power'
        type: DEPENDENT
        key: ne.poe.port.power[{#POEUID}]
        delay: '0'
