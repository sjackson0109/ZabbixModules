zabbix_export:
  version: '7.2'
  template_groups:
  - uuid: 1aacd3256b9b4f8c85b3d6d3ce09774b
    name: Templates/Network Explorer
  templates:
  - uuid: 653fe711105c4b8ba875f01362e52634
    template: ne_cisco_sg300_switch
    name: Network Explorer - Cisco SG300 Switch
    description: 'Link this one template, instead of the Generic Switch, to a Cisco SG300 switch on firmware 1.4. It collects everything the Generic Switch does, plus hardware health from the CISCOSB MIBs in their older 14-column layout: CPU, temperature, fans and power supplies. Its PoE ports are named after their interfaces and report the power each one delivers (CISCOSB-POE-MIB). Port capability is included but disabled, because the SG300 does not implement MAU-MIB. The qualification matrix (docs/qualification/MATRIX.md) lists the models and firmware this has been tested on. Datasets - Base: Device identity, chassis and stack members (SNMPv2-MIB, ENTITY-MIB, LLDP local system).; Interfaces: Interface inventory and state (IF-MIB, ifXTable, EtherLike) with interface discovery.; Port Capability: Supported and advertised port speeds (MAU-MIB) used to derive expected speed. Disabled; enable it where the device supports it.; LLDP: LLDP neighbours with dot1 and dot3 extensions. Set {$NE.LLDP.REDACT_REMOTE} to 1 to drop remote descriptions.; VLAN: VLAN table and per-port membership (Q-BRIDGE-MIB).; STP: Spanning tree bridge and port state (BRIDGE-MIB, RSTP-MIB), instance 0.; LAG: Link aggregation bundles and members (IEEE8023-LAG-MIB, ifStackTable).; Hardware Health: CPU, memory, fans, power supplies and temperature with the device''s own verdicts and thresholds (vendor MIBs).; PoE: Power over Ethernet: budget, consumption and status per PSE unit, and detection status per port (POWER-ETHERNET-MIB), with per-port power where the vendor MIB reports it. Generated by templates/generate_snmp.py; do not edit by hand.'
    vendor:
      name: Network Explorer
      version: 2.3.0
    groups:
    - name: Templates/Network Explorer
    items:
    - uuid: 8a777875645b449f9a5427a1ccd58af5
      name: 'Raw SNMP walk: device'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.1,1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.10,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.13,1.0.8802.1.1.2.1.3.1,1.0.8802.1.1.2.1.3.2,1.0.8802.1.1.2.1.3.8.1.3]
