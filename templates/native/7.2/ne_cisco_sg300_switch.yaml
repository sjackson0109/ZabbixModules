          expression: last(/ne_cisco_sg300_switch/ne.poe.port.state[{#POEUID}])=3 or last(/ne_cisco_sg300_switch/ne.poe.port.state[{#POEUID}])=5
          name: 'Network Explorer: PoE port {#POENAME} reports a fault'
          priority: WARNING
