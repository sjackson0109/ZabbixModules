        delay: '0'
        history: 31d
        value_type: UNSIGNED
        trends: '0'
        valuemap:
          name: Network Explorer PoE port state
        description: pethPsePortDetectionStatus, as the device reports it.
        master_item:
          key: ne.poe.snapshot
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            try { return (function (value) {
            var a=JSON.parse(value).data; for(var i=0;i<a.length;i++){var r=a[i]; if(r.kind==='port'&&r.uid==='{#POEUID}'){var v=r['state']; if(v===null||v===undefined){throw 'Not reported';}var m={"delivering": 0, "searching": 1, "disabled": 2, "fault": 3, "test": 4, "other_fault": 5, "unknown": 6}; v=m[v]===undefined?6:m[v]; return v;}} throw 'Absent; retain last observed value';
            })(value); } catch (error) { return '__NE_DISCARD__'; }
        - type: NOT_MATCHES_REGEX
          parameters:
          - ^__NE_DISCARD__$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: network-explorer
