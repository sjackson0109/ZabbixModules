zabbix_export:
  version: '7.2'
  template_groups:
  - uuid: 1aacd3256b9b4f8c85b3d6d3ce09774b
    name: Templates/Network Explorer
  templates:
  - uuid: 25feff01cb6d4762a4247c7e38486e7f
    template: Network Explorer - Host dashboard
    name: Network Explorer - Host dashboard
    description: Optional. Link to a switch alongside a Network Explorer profile to give it the Network Explorer host dashboard. Import it after the frontend modules are installed and enabled. Generated by templates/generate_snmp.py.
    vendor:
      name: Network Explorer
      version: 0.2.0
    groups:
    - name: Templates/Network Explorer
    tags:
    - tag: component
      value: network-explorer
    dashboards:
    - uuid: 752b6b17ee1746bbaffe6768129b9dbc
      name: Network Explorer
      auto_start: 'NO'
      pages:
      - name: Ports
        widgets:
        - type: nedataquality
          name: Collection quality
          x: '0'
          y: '0'
          width: '72'
          height: '4'
        - type: neportpanel
          name: Port panel
          x: '0'
          y: '4'
          width: '48'
          height: '10'
          fields:
          - type: STRING
            name: reference
            value: NEPRT
        - type: neinterfacedetail
          name: Interface detail
          x: '48'
          y: '4'
          width: '24'
          height: '10'
          fields:
          - type: STRING
            name: itemid._reference
            value: NEPRT._itemid
      - name: Topology
        widgets:
        - type: netopology
          name: Physical topology, VLAN and STP
          x: '0'
          y: '0'
          width: '72'
          height: '12'
      - name: Findings
        widgets:
        - type: nefindings
          name: Findings
          x: '0'
          y: '0'
          width: '72'
          height: '9'
        - type: nedataquality
          name: Dataset quality
          x: '0'
          y: '9'
          width: '72'
          height: '6'
