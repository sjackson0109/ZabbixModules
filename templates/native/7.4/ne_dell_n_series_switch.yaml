          }

          function normaliseDnosHardware(walk, env) {
              var rows = [], i;
              var free = NE.int(NE.scalar(walk, DNOS.cpu + '.1.0')), total = NE.int(NE.scalar(walk, DNOS.cpu + '.2.0'));
