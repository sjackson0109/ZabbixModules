    - macro: '{$NE.IF.STATE.INTERVAL}'
      value: 150s
      description: Polling interval for interfaces.
    - macro: '{$NE.IF.STATE.STALE}'
      value: 450s
      description: Maximum age of a complete interfaces observation.
    - macro: '{$NE.LAG.INTERVAL}'
      value: 15m
      description: Polling interval for lag.
    - macro: '{$NE.LAG.STALE}'
      value: 45m
      description: Maximum age of a complete lag observation.
    - macro: '{$NE.LLDP.INTERVAL}'
      value: 15m
      description: Polling interval for lldp.
    - macro: '{$NE.LLDP.REDACT_REMOTE}'
      value: '0'
      description: 1 drops remote system and port descriptions from stored neighbour data.
    - macro: '{$NE.LLDP.STALE}'
      value: 45m
      description: Maximum age of a complete lldp observation.
    - macro: '{$NE.POE.INTERVAL}'
      value: 5m
      description: Polling interval for poe.
    - macro: '{$NE.POE.POWER.INTERVAL}'
      value: 15m
      description: Polling interval for poe.power.
    - macro: '{$NE.POE.POWER.STALE}'
      value: 45m
      description: Maximum age of a complete poe.power observation.
    - macro: '{$NE.POE.STALE}'
      value: 15m
      description: Maximum age of a complete poe observation.
    - macro: '{$NE.PORT_CAPABILITY.INTERVAL}'
      value: 6h
      description: Polling interval for port_capability.
    - macro: '{$NE.PORT_CAPABILITY.STALE}'
      value: 18h
      description: Maximum age of a complete port_capability observation.
    - macro: '{$NE.SNAPSHOT.HISTORY}'
      value: 2d
      description: How long JSON snapshots and attempt receipts are kept. The frontend reads the latest two; keep it well above {$NE.HEARTBEAT}.
    - macro: '{$NE.STP.INTERVAL}'
      value: 5m
      description: Polling interval for stp.
    - macro: '{$NE.STP.STALE}'
      value: 15m
