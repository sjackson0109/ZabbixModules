zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 1aacd3256b9b4f8c85b3d6d3ce09774b
    name: Templates/Network Explorer
  templates:
  - uuid: b02fd557c5744fe981829f05cf46fe70
    template: ne_dell_n_series_switch
    name: Network Explorer - Dell N Series Switch
    description: 'Link this one template, instead of the Generic Switch, to a Dell Networking N-Series switch on DNOS 6. The N1548P and N4064 have been tested; other N-Series models use the same MIBs but are unqualified. It collects everything the Generic Switch does, plus hardware health from the DNOS and Dell-Vendor MIBs: overall status, CPU, memory, and fans, power supplies and temperature sensors per stack unit. Its PoE ports are named after their interfaces. Port capability is included but disabled, because these models do not implement MAU-MIB. Spanning tree reports unsupported: DNOS has no BRIDGE-MIB spanning tree. The qualification matrix (docs/qualification/MATRIX.md) lists the models and firmware this has been tested on. Datasets - Base: Device identity, chassis and stack members (SNMPv2-MIB, ENTITY-MIB, LLDP local system).; Interfaces: Interface inventory and state (IF-MIB, ifXTable, EtherLike) with interface discovery.; Port Capability: Supported and advertised port speeds (MAU-MIB) used to derive expected speed. Disabled; enable it where the device supports it.; LLDP: LLDP neighbours with dot1 and dot3 extensions. Set {$NE.LLDP.REDACT_REMOTE} to 1 to drop remote descriptions.; VLAN: VLAN table and per-port membership (Q-BRIDGE-MIB).; STP: Spanning tree bridge and port state (BRIDGE-MIB, RSTP-MIB), instance 0.; LAG: Link aggregation bundles and members (IEEE8023-LAG-MIB, ifStackTable).; Hardware Health: CPU, memory, fans, power supplies and temperature with the device''s own verdicts and thresholds (vendor MIBs).; PoE: Power over Ethernet: budget, consumption and status per PSE unit, and detection status per port (POWER-ETHERNET-MIB), with per-port power where the vendor MIB reports it. Generated by templates/generate_snmp.py; do not edit by hand.'
    vendor:
      name: Network Explorer
      version: 2.3.2
    groups:
    - name: Templates/Network Explorer
    items:
    - uuid: 2d4c0747cdfb4e4a90cbc60e3a8ea85e
      name: 'Raw SNMP walk: device'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.1,1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.10,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.13,1.0.8802.1.1.2.1.3.1,1.0.8802.1.1.2.1.3.2,1.0.8802.1.1.2.1.3.8.1.3]
