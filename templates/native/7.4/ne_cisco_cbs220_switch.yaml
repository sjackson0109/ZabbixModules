                      kind: 'port', instance: 0, interface_uid: uid, bridge_port: ports[i],
                      role: role, role_source: role === 'unknown' ? 'unknown' : 'derived', state: state,
                      cost: cost32 !== null && cost32 > 0 ? cost32 : NE.int(t.portCost[p] || null),
