              delete out.data;
              out.blocks = [];
              for (i = 0; i < blocks.length; i++) { out.blocks.push({columns: blocks[i].columns, rows: blocks[i].rows}); }
              return out;
          };

          // UTF-8 length of a string, as Zabbix measures a stored value.
          NE.utf8Length = function (text) {
