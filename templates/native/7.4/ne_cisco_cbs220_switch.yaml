zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 1aacd3256b9b4f8c85b3d6d3ce09774b
    name: Templates/Network Explorer
  templates:
  - uuid: cb3b2c2ba2b54efcad8b84a02194cde5
    template: ne_cisco_cbs220_switch
    name: Network Explorer - Cisco CBS220 Switch
    description: 'Link this one template, instead of the Generic Switch, to a Cisco Business 220 (CBS220) smart switch. It collects everything the Generic Switch does, with its PoE ports named after their interfaces. Hardware health (temperature, fans and power supplies from CISCO-ENVMON-MIB, which Cisco''s data sheet lists for the series) is included but disabled: firmware 2.0.2.15 does not answer that MIB. Enable it only on a switch whose firmware does. Port capability is included but disabled, because the CBS220 does not implement MAU-MIB. The qualification matrix (docs/qualification/MATRIX.md) lists the models and firmware this has been tested on. Datasets - Base: Device identity, chassis and stack members (SNMPv2-MIB, ENTITY-MIB, LLDP local system).; Interfaces: Interface inventory and state (IF-MIB, ifXTable, EtherLike) with interface discovery.; Port Capability: Supported and advertised port speeds (MAU-MIB) used to derive expected speed. Disabled; enable it where the device supports it.; LLDP: LLDP neighbours with dot1 and dot3 extensions. Set {$NE.LLDP.REDACT_REMOTE} to 1 to drop remote descriptions.; VLAN: VLAN table and per-port membership (Q-BRIDGE-MIB).; STP: Spanning tree bridge and port state (BRIDGE-MIB, RSTP-MIB), instance 0.; LAG: Link aggregation bundles and members (IEEE8023-LAG-MIB, ifStackTable).; Hardware Health: CPU, memory, fans, power supplies and temperature with the device''s own verdicts and thresholds (vendor MIBs). Disabled; enable it where the device supports it.; PoE: Power over Ethernet: budget, consumption and status per PSE unit, and detection status per port (POWER-ETHERNET-MIB), with per-port power where the vendor MIB reports it. Generated by templates/generate_snmp.py; do not edit by hand.'
    vendor:
      name: Network Explorer
      version: 2.3.2
    groups:
    - name: Templates/Network Explorer
    items:
    - uuid: 7d2dc7ec35004245b499073d324d9898
      name: 'Raw SNMP walk: device'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.1,1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.10,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.13,1.0.8802.1.1.2.1.3.1,1.0.8802.1.1.2.1.3.2,1.0.8802.1.1.2.1.3.8.1.3]
      key: ne.raw.system
      delay: '{$NE.DEVICE.INTERVAL}'
      history: '0'
