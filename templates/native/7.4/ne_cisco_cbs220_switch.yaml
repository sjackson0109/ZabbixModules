    tags:
    - tag: component
      value: network-explorer
    macros:
    - macro: '{$NE.DEVICE.INTERVAL}'
      value: 1h
      description: Polling interval for device.
    - macro: '{$NE.DEVICE.STALE}'
      value: 3h
      description: Maximum age of a complete device observation.
    - macro: '{$NE.HARDWARE.INTERVAL}'
      value: 5m
      description: Polling interval for hardware.
    - macro: '{$NE.HARDWARE.STALE}'
      value: 15m
      description: Maximum age of a complete hardware observation.
    - macro: '{$NE.HEARTBEAT}'
      value: 2h
      description: An unchanged state, snapshot or attempt receipt is stored again at least this often; a change is stored at once. Lengthen it to write less; triggers on these items are re-checked only when a value is stored.
    - macro: '{$NE.IF.EXPECTED_SPEED}'
      value: '0'
      description: Expected speed in bit/s, with an interface-name context. 0 derives it from capability.
    - macro: '{$NE.IF.INVENTORY.INTERVAL}'
      value: 1h
      description: Polling interval for interfaces.inventory.
    - macro: '{$NE.IF.INVENTORY.STALE}'
      value: 3h
      description: Maximum age of a complete interfaces.inventory observation.
    - macro: '{$NE.IF.LINK.INTERVAL}'
      value: 15m
      description: Polling interval for interfaces.link.
    - macro: '{$NE.IF.LINK.STALE}'
      value: 45m
      description: Maximum age of a complete interfaces.link observation.
    - macro: '{$NE.IF.MONITOR}'
      value: '0'
      description: Set to 1 with an interface-name context to alert when that port goes down.
    - macro: '{$NE.IF.STATE.INTERVAL}'
      value: 150s
      description: Polling interval for interfaces.
    - macro: '{$NE.IF.STATE.STALE}'
      value: 450s
      description: Maximum age of a complete interfaces observation.
    - macro: '{$NE.LAG.INTERVAL}'
      value: 15m
      description: Polling interval for lag.
    - macro: '{$NE.LAG.STALE}'
      value: 45m
      description: Maximum age of a complete lag observation.
    - macro: '{$NE.LLDP.INTERVAL}'
      value: 15m
      description: Polling interval for lldp.
    - macro: '{$NE.LLDP.REDACT_REMOTE}'
      value: '0'
      description: 1 drops remote system and port descriptions from stored neighbour data.
    - macro: '{$NE.LLDP.STALE}'
      value: 45m
      description: Maximum age of a complete lldp observation.
    - macro: '{$NE.POE.INTERVAL}'
      value: 5m
      description: Polling interval for poe.
    - macro: '{$NE.POE.POWER.INTERVAL}'
      value: 15m
      description: Polling interval for poe.power.
    - macro: '{$NE.POE.POWER.STALE}'
      value: 45m
      description: Maximum age of a complete poe.power observation.
    - macro: '{$NE.POE.STALE}'
      value: 15m
      description: Maximum age of a complete poe observation.
    - macro: '{$NE.PORT_CAPABILITY.INTERVAL}'
      value: 6h
      description: Polling interval for port_capability.
    - macro: '{$NE.PORT_CAPABILITY.STALE}'
      value: 18h
      description: Maximum age of a complete port_capability observation.
    - macro: '{$NE.SNAPSHOT.HISTORY}'
      value: 2d
      description: How long JSON snapshots and attempt receipts are kept. The frontend reads the latest two; keep it well above {$NE.HEARTBEAT}.
    - macro: '{$NE.STP.INTERVAL}'
      value: 5m
      description: Polling interval for stp.
    - macro: '{$NE.STP.STALE}'
      value: 15m
      description: Maximum age of a complete stp observation.
    - macro: '{$NE.TRENDS}'
      value: 180d
      description: How long hourly trends of readings are kept.
    - macro: '{$NE.VLAN.INTERVAL}'
      value: 30m
      description: Polling interval for vlan.
    - macro: '{$NE.VLAN.STALE}'
      value: 90m
      description: Maximum age of a complete vlan observation.
