              TEMP: '1.3.6.1.4.1.9.9.13.1.3.1',     // ciscoEnvMonTemperatureStatusEntry
              FAN: '1.3.6.1.4.1.9.9.13.1.4.1',      // ciscoEnvMonFanStatusEntry
              SUPPLY: '1.3.6.1.4.1.9.9.13.1.5.1'    // ciscoEnvMonSupplyStatusEntry
