          // Indexes are numeric strings; a UID is built from them only, so it is always safe for LLD.
          HW.indexUid = function (kind, index) {
              return /^[0-9]+(\.[0-9]+)*$/.test(index) ? kind + '-' + index.replace(/\./g, '-') : null;
          };

