              if (!NE.has(walk, GAP.PHY_TYPE)) {
                  throw {unsupported: 'The agent does not expose the IEEE 802.11 MIB (dot11PHYType), so it is not read as an access point. Link a vendor Wi-Fi template instead.',
                         code: 'not_wifi_ap'};
              }
          };

