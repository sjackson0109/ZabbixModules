              // complete snapshot is kept and the dataset's staleness alert fires as for any other failure.
              if (NE.utf8Length(JSON.stringify(NE.pack(env))) > NE.TEXT_LIMIT - NE.STORED_RESERVE) {
                  var count = env.data.length;
