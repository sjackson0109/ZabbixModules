                  seen[name] = {ssid_uid: WE.ssidUid(name), name: name, enabled: enabled, hidden: null, client_count: null,
                                vlan_id: null, security: null, profiles: 1};
                  out.push(seen[name]);
              }
              return WE.sort(out, ['name']);
          };

          return JSON.stringify(WE.run('ap_state', 'generic-ap-state', value, function (w, e) { return GAP.apState(w, e); }));
      tags:
      - tag: component
        value: wifi-explorer
      - tag: dataset
        value: ap_state
      - tag: data_source
        value: native-snmp
