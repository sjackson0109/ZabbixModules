          GAP.column = function (walk, base) {
              var cells = NE.table(walk, base), out = {}, suffix;
              for (suffix in cells) {
                  if (cells.hasOwnProperty(suffix) && /^[0-9]+$/.test(suffix)) { out[suffix] = cells[suffix]; }
