      name: 'Raw SNMP walk: device'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.1,1.3.6.1.4.1.14823.2.3.3.1.1.4,1.3.6.1.4.1.14823.2.3.3.1.1.5]
