          // firmware 8.13.2.0 and 6.5.4.11); see docs/wifi-explorer/ARUBA_TEMPLATE_REVIEW.md. aiAccessPointTable and
          // aiRadioTable are populated only on the elected virtual controller (VC) and empty on members, and
