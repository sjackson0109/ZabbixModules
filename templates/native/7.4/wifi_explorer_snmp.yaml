    - uuid: 2b576b43670d42eea43a63bc0c687562
      name: 'Raw SNMP walk: client'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.1.3,1.3.6.1.4.1.14823.2.3.3.1.1.5,1.3.6.1.4.1.14823.2.3.3.1.2.1.1.1,1.3.6.1.4.1.14823.2.3.3.1.2.1.1.3,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.1,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.2,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.3,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.4,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.5,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.7,1.3.6.1.4.1.14823.2.3.3.1.2.4.1.16]
      key: we.raw.aruba.client
