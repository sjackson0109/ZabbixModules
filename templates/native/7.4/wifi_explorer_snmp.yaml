          // They are reported as a warning unless quiet is set, for datasets that only
          // join to interfaces.
          NE.interfaceIndex = function (walk, env, quiet) {
              var names = NE.table(walk, NE.IF.name), descrs = NE.table(walk, NE.IF.descr);
