    - uuid: 7f30ad997c46411990b192cdbfcd26d5
      name: 'Normalised envelope: device'
      type: DEPENDENT
      key: we.normalised[device]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: The canonical envelope of each attempt, passed to the items below; not stored.
      master_item:
        key: we.raw.aruba.system
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          // Shared helpers for Network Explorer SNMP normalisers.
          // Runs inside Zabbix JavaScript preprocessing (Duktape, ECMAScript 5.1):
          // no let/const, arrow functions, template literals or ES2015+ library calls.
          // The global sha256() is provided by Zabbix (and by the Node test harness).

          var NE = {};
          NE.SCHEMA = '1.1';
          NE.VERSION = '1.3.0';  // The root VERSION file; tests/unit/test_native_templates.py checks it.
          NE.FAILED = '__NE_COLLECTION_FAILED__';
          NE.UPTIME = '1.3.6.1.2.1.1.3.0';

          NE.IF = {
              number: '1.3.6.1.2.1.2.1.0',
              descr: '1.3.6.1.2.1.2.2.1.2',
              type: '1.3.6.1.2.1.2.2.1.3',
              mtu: '1.3.6.1.2.1.2.2.1.4',
              speed: '1.3.6.1.2.1.2.2.1.5',
              mac: '1.3.6.1.2.1.2.2.1.6',
              admin: '1.3.6.1.2.1.2.2.1.7',
              oper: '1.3.6.1.2.1.2.2.1.8',
              lastChange: '1.3.6.1.2.1.2.2.1.9',
              name: '1.3.6.1.2.1.31.1.1.1.1',
              highSpeed: '1.3.6.1.2.1.31.1.1.1.15',
              connector: '1.3.6.1.2.1.31.1.1.1.17',
              alias: '1.3.6.1.2.1.31.1.1.1.18',
              stack: '1.3.6.1.2.1.31.1.2.1.3',
              duplex: '1.3.6.1.2.1.10.7.2.1.19',
              // ENTITY-MIB: physical position of each port (stack member, slot, port).
              entContained: '1.3.6.1.2.1.47.1.1.1.1.4',
              entClass: '1.3.6.1.2.1.47.1.1.1.1.5',
              entRelPos: '1.3.6.1.2.1.47.1.1.1.1.6',
              entAlias: '1.3.6.1.2.1.47.1.3.2.1.2'
          };
          NE.BRIDGE_PORT_IFINDEX = '1.3.6.1.2.1.17.1.4.1.2';

          // ---------------------------------------------------------------- parsing

          // Parses Zabbix walk[] output: one "OID = TYPE: value" entry per line, numeric
          // OIDs and enums, quoted STRING values (which may span lines), and unquoted
          // Hex-STRING values (which net-snmp may wrap onto continuation lines).
          NE.parseWalk = function (text) {
              var rows = {}, order = [], pos = 0, len = text.length;
              var head = /^\.?([0-9]+(?:\.[0-9]+)*) = (?:([A-Za-z0-9-]+): ?)?/;
              while (pos < len) {
                  var eol = text.indexOf('\n', pos);
                  if (eol < 0) { eol = len; }
                  var line = text.substring(pos, eol);
                  var m = head.exec(line);
                  if (!m) { pos = eol + 1; continue; }
                  var oid = m[1], type = m[2] || 'STRING', start = pos + m[0].length, value;
                  if (text.charAt(start) === '"') {
                      var i = start + 1, out = '';
                      while (i < len && text.charAt(i) !== '"') {
                          if (text.charAt(i) === '\\' && i + 1 < len) { i++; }
                          out += text.charAt(i);
                          i++;
                      }
                      value = out;
                      eol = text.indexOf('\n', i);
                      if (eol < 0) { eol = len; }
                  }
                  else {
                      value = text.substring(start, eol);
                      // Unquoted continuation lines (wrapped Hex-STRING) until the next OID line.
                      while (eol < len) {
                          var next = text.indexOf('\n', eol + 1);
                          if (next < 0) { next = len; }
                          var more = text.substring(eol + 1, next);
                          if (more === '' || head.test(more)) { break; }
                          value += ' ' + more;
                          eol = next;
                      }
                      value = value.replace(/\s+$/, '');
                  }
                  if (/^No (Such|more) /.test(value)) { type = 'MISSING'; }
                  if (!rows.hasOwnProperty(oid)) { order.push(oid); }
                  rows[oid] = {type: type, value: value};
                  pos = eol + 1;
              }
              return {rows: rows, order: order};
          };

          // Returns {suffix: entry} for every row under base (suffix without the dot).
          NE.table = function (walk, base) {
              var out = {}, prefix = base + '.', i, oid;
              for (i = 0; i < walk.order.length; i++) {
                  oid = walk.order[i];
                  if (oid.indexOf(prefix) === 0 && walk.rows[oid].type !== 'MISSING') {
                      out[oid.substring(prefix.length)] = walk.rows[oid];
                  }
              }
              return out;
          };

          NE.has = function (walk, base) {
              var prefix = base + '.', i;
              for (i = 0; i < walk.order.length; i++) {
                  if (walk.order[i].indexOf(prefix) === 0 && walk.rows[walk.order[i]].type !== 'MISSING') { return true; }
              }
              return false;
          };

          NE.scalar = function (walk, oid) {
              var row = walk.rows[oid];
              return row && row.type !== 'MISSING' ? row : null;
          };

          // ---------------------------------------------------------------- values

          NE.int = function (entry) {
              if (!entry) { return null; }
              var m = /-?[0-9]+/.exec(entry.value);
              if (!m) { return null; }
              var n = parseInt(m[0], 10);
              return isFinite(n) ? n : null;
          };

          NE.utf8Encode = function (s) {
              var out = [], i, c;
              for (i = 0; i < s.length; i++) {
                  c = s.charCodeAt(i);
                  if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {
                      c = 0x10000 + ((c - 0xd800) << 10) + (s.charCodeAt(++i) - 0xdc00);
                  }
                  if (c < 0x80) { out.push(c); }
                  else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
                  else if (c < 0x10000) { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
                  else { out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
              }
              return out;
          };

          NE.utf8Decode = function (bytes) {
              var out = '', i = 0, c, n, cp;
              while (i < bytes.length) {
                  c = bytes[i++];
                  if (c < 0x80) { cp = c; n = 0; }
                  else if (c >= 0xc2 && c < 0xe0) { cp = c & 31; n = 1; }
                  else if (c >= 0xe0 && c < 0xf0) { cp = c & 15; n = 2; }
                  else if (c >= 0xf0 && c < 0xf5) { cp = c & 7; n = 3; }
                  else { return null; }
                  while (n-- > 0) {
                      if (i >= bytes.length || (bytes[i] & 0xc0) !== 0x80) { return null; }
                      cp = (cp << 6) | (bytes[i++] & 63);
                  }
                  if (cp >= 0x10000) {
                      cp -= 0x10000;
                      out += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 1023));
                  }
                  else { out += String.fromCharCode(cp); }
              }
              return out;
          };

          // Raw octets of an OCTET STRING / BITS value, whichever form Zabbix printed.
          NE.bytes = function (entry) {
              if (!entry) { return null; }
              var v = entry.value, out = [], parts, i;
              if (entry.type === 'Hex-STRING' || entry.type === 'BITS') {
                  parts = v.split(/\s+/);
                  for (i = 0; i < parts.length; i++) {
                      if (!/^[0-9A-Fa-f]{2}$/.test(parts[i])) { break; }
                      out.push(parseInt(parts[i], 16));
                  }
                  return out;
              }
              // A MacAddress display hint prints "0:1b:2c:..." as a STRING.
              if (/^[0-9A-Fa-f]{1,2}([:-][0-9A-Fa-f]{1,2}){5,}$/.test(v)) {
                  parts = v.split(/[:-]/);
                  for (i = 0; i < parts.length; i++) { out.push(parseInt(parts[i], 16)); }
                  return out;
              }
              // Zabbix prints octets that are valid UTF-8 as a STRING.
              return NE.utf8Encode(v);
          };

          NE.hex = function (bytes) {
              var out = '', i;
              for (i = 0; i < bytes.length; i++) { out += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16); }
              return out;
          };

          NE.text = function (entry) {
              if (!entry) { return null; }
              if (entry.type === 'Hex-STRING') {
                  var bytes = NE.bytes(entry), decoded = NE.utf8Decode(bytes);
                  return decoded !== null ? decoded.replace(/\u0000+$/, '') : 'hex:' + NE.hex(bytes);
              }
              return entry.value;
          };

          NE.mac = function (entry) {
              var b = NE.bytes(entry);
              if (!b || b.length !== 6) { return null; }
              var parts = [], i;
              for (i = 0; i < 6; i++) { parts.push((b[i] < 16 ? '0' : '') + b[i].toString(16)); }
              return parts.join(':');
          };

          // Bits set in an octet string, numbered MSB-first from 0 (SNMP BITS and PortList).
          NE.bitsSet = function (bytes, offset) {
              var out = [], i, b;
              if (!bytes) { return out; }
              for (i = 0; i < bytes.length; i++) {
                  for (b = 0; b < 8; b++) {
                      if (bytes[i] & (0x80 >> b)) { out.push(i * 8 + b + (offset || 0)); }
                  }
              }
              return out;
          };

          NE.ipFromOctets = function (octets) {
              var i, parts = [];
              if (octets.length === 4) { return octets.join('.'); }
              if (octets.length !== 16) { return null; }
              for (i = 0; i < 16; i += 2) { parts.push(((octets[i] << 8) | octets[i + 1]).toString(16)); }
              // RFC 5952: compress the longest run (two or more) of zero groups.
              var best = -1, bestLen = 1, run = 0;
              for (i = 0; i <= 8; i++) {
                  if (i < 8 && parts[i] === '0') { run++; continue; }
                  if (run > bestLen) { best = i - run; bestLen = run; }
                  run = 0;
              }
              if (best < 0) { return parts.join(':'); }
              return parts.slice(0, best).join(':') + '::' + parts.slice(best + bestLen).join(':');
          };

          // "1,3-5,49"; empty list gives "", null gives null.
          NE.ranges = function (ids) {
              if (ids === null) { return null; }
              var sorted = ids.slice().sort(function (a, b) { return a - b; }), out = [], i, start, prev;
              for (i = 0; i < sorted.length; i++) {
                  if (i > 0 && sorted[i] === prev) { continue; }
                  if (start === undefined) { start = prev = sorted[i]; continue; }
                  if (sorted[i] === prev + 1) { prev = sorted[i]; continue; }
                  out.push(start === prev ? String(start) : start + '-' + prev);
                  start = prev = sorted[i];
              }
              if (start !== undefined) { out.push(start === prev ? String(start) : start + '-' + prev); }
              return out.join(',');
          };

          // ---------------------------------------------------------------- interfaces

          NE.uid = function (name, descr) {
              var basis = null;
              if (name !== null && name !== undefined && name.replace(/^\s+|\s+$/g, '') !== '') {
                  basis = 'name:' + name.replace(/^\s+|\s+$/g, '');
              }
              else if (descr !== null && descr !== undefined && descr.replace(/^\s+|\s+$/g, '') !== '') {
                  basis = 'description:' + descr.replace(/^\s+|\s+$/g, '');
              }
              return basis === null ? null : 'if-' + sha256(basis).substring(0, 24);
          };

          // {ifIndex: uid} from the ifName/ifDescr join columns every dataset walks.
          // Duplicate or missing identities map to null, so those rows are dropped.
          // They are reported as a warning unless quiet is set, for datasets that only
          // join to interfaces.
          NE.interfaceIndex = function (walk, env, quiet) {
              var names = NE.table(walk, NE.IF.name), descrs = NE.table(walk, NE.IF.descr);
              var out = {}, seen = {}, k, uid;
              for (k in descrs) { if (descrs.hasOwnProperty(k)) { out[k] = null; } }
              for (k in names) { if (names.hasOwnProperty(k)) { out[k] = null; } }
              for (k in out) {
                  if (!out.hasOwnProperty(k)) { continue; }
                  uid = NE.uid(NE.text(names[k] || null), NE.text(descrs[k] || null));
                  out[k] = uid;
                  if (uid !== null) { seen[uid] = (seen[uid] || 0) + 1; }
              }
              for (k in out) {
                  if (out.hasOwnProperty(k) && (out[k] === null || seen[out[k]] > 1)) {
                      out[k] = null;
                      if (!quiet) { NE.warning(env, 'identity_ambiguous', 'An interface name is missing or duplicated; that interface is skipped.'); }
                  }
              }
              return out;
          };

          // ---------------------------------------------------------------- LLDP identifiers

          // Chassis subtype 4 / port subtype 3 are MAC; chassis 5 / port 4 are network addresses.
          NE.lldpId = function (subtypeEntry, valueEntry, kind) {
              var subtype = NE.int(subtypeEntry), macType = kind === 'chassis' ? 4 : 3;
              var netType = kind === 'chassis' ? 5 : 4, value = null, bytes;
              if (subtype === macType) { value = NE.mac(valueEntry); }
              else if (subtype === netType) {
                  bytes = NE.bytes(valueEntry);
                  if (bytes && bytes.length > 1 && (bytes[0] === 1 || bytes[0] === 2)) { value = NE.ipFromOctets(bytes.slice(1)); }
              }
              if (value === null && valueEntry) { value = NE.text(valueEntry); }
              return {subtype: subtype !== null && subtype >= 1 && subtype <= 7 ? subtype : null, value: value || ''};
          };

          // ---------------------------------------------------------------- MAU / speeds

          // IANA-MAU-MIB dot3MauType arc -> [speed bit/s, duplex, media]. The same
          // numbers are the IANAifMauTypeListBits positions.
          // From 40G up (IANA-MAU-MIB revision 2017-04-10):
          //   70 dot3MauType40GbaseKR4, 71 40GbaseCR4, 72 40GbaseSR4, 73 40GbaseFR,
          //   74 40GbaseLR4, 75 100GbaseCR10, 76 100GbaseSR10, 77 100GbaseLR4,
          //   78 100GbaseER4, 88 25GbaseCR, 89 25GbaseCRS, 90 25GbaseKR, 91 25GbaseKRS,
          //   92 25GbaseR, 93 25GbaseSR, 94 25GbaseT, 95 40GbaseER4, 96 40GbaseR,
          //   97 40GbaseT, 98 100GbaseCR4, 99 100GbaseKR4, 100 100GbaseKP4,
          //   101 100GbaseR, 102 100GbaseSR4.
          // That revision defines no 2.5G, 5G or 50G types. Media is null for 25G/40G/
          // 100G MAUs other than BASE-T: the port_capability media enum has no SFP28 or
          // QSFP value, and a backplane or undefined PMD names no cage.
          NE.MAU = {
              5: [10e6, null, 'copper'], 10: [10e6, 'half', 'copper'], 11: [10e6, 'full', 'copper'],
              14: [100e6, 'half', 'copper'], 15: [100e6, 'half', 'copper'], 16: [100e6, 'full', 'copper'],
              17: [100e6, 'half', 'sfp'], 18: [100e6, 'full', 'sfp'], 19: [100e6, 'half', 'copper'], 20: [100e6, 'full', 'copper'],
              21: [1e9, 'half', 'sfp'], 22: [1e9, 'full', 'sfp'], 23: [1e9, 'half', 'sfp'], 24: [1e9, 'full', 'sfp'],
              25: [1e9, 'half', 'sfp'], 26: [1e9, 'full', 'sfp'], 27: [1e9, 'half', 'copper'], 28: [1e9, 'full', 'copper'],
              29: [1e9, 'half', 'copper'], 30: [1e9, 'full', 'copper'],
              31: [10e9, 'full', 'sfp_plus'], 32: [10e9, 'full', 'sfp_plus'], 33: [10e9, 'full', 'sfp_plus'],
              34: [10e9, 'full', 'sfp_plus'], 35: [10e9, 'full', 'sfp_plus'], 36: [10e9, 'full', 'sfp_plus'],
              41: [10e9, 'full', 'copper'], 44: [100e6, 'full', 'sfp'], 45: [100e6, 'full', 'sfp'], 46: [100e6, 'full', 'sfp'],
              47: [1e9, 'full', 'sfp'], 48: [1e9, 'full', 'sfp'], 49: [1e9, 'full', 'sfp'],
              54: [10e9, 'full', 'copper'], 55: [10e9, 'full', 'sfp_plus'],
              70: [40e9, 'full', null], 71: [40e9, 'full', null], 72: [40e9, 'full', null], 73: [40e9, 'full', null],
              74: [40e9, 'full', null], 75: [100e9, 'full', null], 76: [100e9, 'full', null], 77: [100e9, 'full', null],
              78: [100e9, 'full', null],
              88: [25e9, 'full', null], 89: [25e9, 'full', null], 90: [25e9, 'full', null], 91: [25e9, 'full', null],
              92: [25e9, 'full', null], 93: [25e9, 'full', null], 94: [25e9, 'full', 'copper'],
              95: [40e9, 'full', null], 96: [40e9, 'full', null], 97: [40e9, 'full', 'copper'],
              98: [100e9, 'full', null], 99: [100e9, 'full', null], 100: [100e9, 'full', null], 101: [100e9, 'full', null],
              102: [100e9, 'full', null]
          };

          NE.mauArc = function (entry) {
              if (!entry) { return null; }
              var m = /([0-9]+)$/.exec(entry.value);
              return m ? parseInt(m[1], 10) : null;
          };

          // Autonegotiation capability bits (ifMauAutoNegCapAdvertisedBits and the
          // LLDP 802.3 extension) -> distinct speeds in bit/s.
          NE.AUTONEG_SPEED = {1: 10e6, 2: 10e6, 3: 100e6, 4: 100e6, 5: 100e6, 6: 100e6, 7: 100e6,
                              12: 1e9, 13: 1e9, 14: 1e9, 15: 1e9};

          NE.speedsFromBits = function (bits, table) {
              var seen = {}, out = [], i, s;
              for (i = 0; i < bits.length; i++) {
                  s = table === 'mau' ? (NE.MAU[bits[i]] ? NE.MAU[bits[i]][0] : null) : NE.AUTONEG_SPEED[bits[i]];
                  if (s && !seen[s]) { seen[s] = true; out.push(s); }
              }
              return out.sort(function (a, b) { return a - b; });
          };

          // ---------------------------------------------------------------- envelope

          NE.error = function (env, code, message) { NE.note(env.errors, code, message); };

          // A problem confined to one row: the row is dropped or kept with unknown
          // fields, and the rest of the dataset stays a complete observation.
          NE.warning = function (env, code, message) { NE.note(env.warnings, code, message); };

          NE.note = function (list, code, message) {
              for (var i = 0; i < list.length; i++) {
                  if (list[i].code === code) { return; }
              }
              if (list.length < 256) { list.push({code: code, message: message}); }
          };

          NE.envelope = function (dataset, adapter) {
              var now = new Date().toISOString();
              return {
                  schema_version: NE.SCHEMA, dataset: dataset,
                  generation_id: dataset + '-' + now.replace(/[^0-9]/g, '') + '-' + Math.floor(Math.random() * 1e9),
                  attempted_at: now, observed_at: null, status: 'failed', complete: false,
                  source: {method: 'native_snmp', adapter: adapter, version: NE.VERSION},
                  capability: {state: 'unknown', reason: null}, errors: [], warnings: [], data: []
              };
          };

          // Runs a dataset normaliser and sets status/completeness consistently.
          //   normalise(walk, env) returns rows, or throws {unsupported: reason}.
          //   Any error recorded on env makes the result partial.
          NE.run = function (dataset, adapter, value, normalise) {
              var env = NE.envelope(dataset, adapter);
              if (value === NE.FAILED || value === '' || value === null || value === undefined) {
                  NE.error(env, 'collection_failed', 'The SNMP walk returned no data or the item is not supported.');
                  return env;
              }
              var walk, rows;
              try {
                  walk = NE.parseWalk(String(value));
                  if (!NE.scalar(walk, NE.UPTIME)) {
                      NE.error(env, 'agent_unreachable', 'The walk did not include sysUpTime; the agent did not answer.');
                      return env;
                  }
                  rows = normalise(walk, env);
              }
              catch (e) {
                  if (e && e.unsupported) {
                      env.status = 'unsupported';
                      env.capability = {state: 'unsupported', reason: e.unsupported};
                      env.errors = [{code: 'unsupported', message: e.unsupported}];
                      env.warnings = [];
                      return env;
                  }
                  // A normaliser bug still records a failed attempt rather than no
                  // envelope at all. The message is fixed: an exception can quote
                  // device data.
                  env.errors = [{code: 'normaliser_error', message: 'The normaliser failed on this walk; nothing was observed.'}];
                  env.warnings = [];
                  return env;
              }
              env.observed_at = env.attempted_at;
              env.data = rows;
              if (env.errors.length) {
                  env.status = 'partial';
                  env.capability = {state: 'partial', reason: env.errors[0].message};
              }
              else {
                  env.status = 'ok';
                  env.complete = true;
                  env.capability = {state: 'supported', reason: null};
              }
              return env;
          };

          // Shared helpers for Wi-Fi Explorer normalisers, composed after lib.js.
          // Same engine rules as lib.js: Duktape, ECMAScript 5.1 only.
          //
          // Wi-Fi envelopes keep Network Explorer's envelope semantics (status, completeness, attempt and observation
          // time, errors and warnings) and only change the schema version, so a Network Explorer reader rejects a Wi-Fi
          // envelope as an unsupported schema and the reverse.

          var WE = {};
          WE.SCHEMA = 'wifi-1.0';

          // Runs a Wi-Fi normaliser through NE.run. A normaliser may throw {unsupported: reason, code: 'stable_code'};
          // the code replaces the generic 'unsupported' error code so the frontend can say what to change.
          WE.run = function (dataset, adapter, value, normalise) {
              var code = null;
              var env = NE.run(dataset, adapter, value, function (w, e) {
                  try {
                      return normalise(w, e);
                  }
                  catch (x) {
                      if (x && x.unsupported && typeof x.code === 'string') { code = x.code; }
                      throw x;
                  }
              });
              env.schema_version = WE.SCHEMA;
              if (env.status === 'unsupported' && code !== null) { env.errors[0].code = code; }
              return env;
          };

          // Opaque identities: stable across adapters for the same hardware, safe in URLs, never a raw MAC.
          WE.apUid = function (mac) { return 'ap-' + sha256('ap:' + mac).substring(0, 24); };
          WE.radioUid = function (mac, index) { return 'radio-' + sha256('radio:' + mac + ':' + index).substring(0, 24); };

          WE.blank = function (s) { return s === null || s === undefined || String(s).replace(/\s+/g, '') === '' ? null : String(s); };

          WE.ipv4 = function (entry) {
              var v = entry ? String(entry.value).replace(/^\s+|\s+$/g, '') : '';
              var m = /^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$/.exec(v);
              if (!m) { return null; }
              for (var i = 1; i <= 4; i++) {
                  if (parseInt(m[i], 10) > 255) { return null; }
              }
              return v === '0.0.0.0' ? null : v;
          };

          // A MAC from OID index arcs (six decimal octets).
          WE.macFromArcs = function (arcs) {
              if (arcs.length !== 6) { return null; }
              var parts = [], i, n;
              for (i = 0; i < 6; i++) {
                  n = parseInt(arcs[i], 10);
                  if (!(n >= 0 && n <= 255)) { return null; }
                  parts.push((n < 16 ? '0' : '') + n.toString(16));
              }
              return parts.join(':');
          };

          // Integer within [min, max], else null (an out-of-range value is unknown, not clamped).
          WE.bounded = function (entry, min, max) {
              var n = NE.int(entry);
              return n !== null && n >= min && n <= max ? n : null;
          };

          // Rows sorted by a key list, for deterministic output.
          WE.sort = function (rows, keys) {
              return rows.sort(function (a, b) {
                  for (var i = 0; i < keys.length; i++) {
                      var x = a[keys[i]], y = b[keys[i]];
                      if (x === y) { continue; }
                      if (x === null) { return 1; }
                      if (y === null) { return -1; }
                      return x < y ? -1 : 1;
                  }
                  return 0;
              });
          };

          // An SSID's identity: its name. The same SSID name on several clusters is one service.
          WE.ssidUid = function (name) { return 'ssid-' + sha256('ssid:' + name).substring(0, 24); };

          // Client identity policy, set per owner host with the WE.CLIENT.IDENTIFIERS user macro and applied before anything is stored:
          //   full           MAC address, IP address and client name are kept;
          //   partial        (default) the MAC keeps its manufacturer prefix only; IP address and name are dropped;
          //   pseudonymised  no MAC, IP address or name; only the keyed client ID.
          // The client ID is keyed with the WE.CLIENT.KEY secret user macro. Without a key it is a plain hash of the MAC, which
          // someone who can read it could reverse by trying every MAC address, so pseudonymised falls back to partial.
          WE.clientPolicy = function (policy, key) {
              var p = String(policy === undefined || policy === null ? '' : policy);
              var k = String(key === undefined || key === null ? '' : key);
              if (k.indexOf('{$') === 0) { k = ''; }   // An unexpanded macro (outside Zabbix) is no key.
              if (p !== 'full' && p !== 'partial' && p !== 'pseudonymised') { p = 'partial'; }
              return {policy: p === 'pseudonymised' && k === '' ? 'partial' : p, requested: p, key: k};
          };

          WE.clientUid = function (mac, key) {
              return 'client-' + sha256('client:' + key + ':' + mac).substring(0, 24);
          };

          WE.maskMac = function (mac) { return mac.substring(0, 8) + ':xx:xx:xx'; };

          // Aruba Instant (AI-AP-MIB, 1.3.6.1.4.1.14823.2.3.3) -> canonical Wi-Fi datasets.
          //
          // Evidence: the operator's Aruba Wireless template notes (live walks of five Instant APs in two clusters,
          // firmware 8.13.2.0 and 6.5.4.11); see docs/wifi-explorer/ARUBA_TEMPLATE_REVIEW.md. aiAccessPointTable and
          // aiRadioTable are populated only on the elected virtual controller (VC) and empty on members, and
          // aiVirtualControllerIPAddress reads 0.0.0.0 on members. Every AP and radio dataset therefore requires the VC
          // role, so a member host never reports an empty site.

          var ARUBA = {};
          ARUBA.ENTERPRISE = '1.3.6.1.4.1.14823';
          ARUBA.VERSION = '1.3.6.1.4.1.14823.2.3.3.1.1.4.0';     // aiControllerVersion (populated on the VC)
          ARUBA.VC_IP = '1.3.6.1.4.1.14823.2.3.3.1.1.5.0';       // aiVirtualControllerIPAddress
          ARUBA.AP = '1.3.6.1.4.1.14823.2.3.3.1.2.1.1';          // aiAccessPointEntry, indexed by AP MAC
          ARUBA.RADIO = '1.3.6.1.4.1.14823.2.3.3.1.2.2.1';       // aiRadioEntry, indexed by AP MAC and radio index
          ARUBA.AP_COL = {mac: 1, name: 2, ip: 3, serial: 4, model: 6, cpu: 7, memFree: 8, uptime: 9, memTotal: 10, status: 11};
          ARUBA.RADIO_COL = {apMac: 1, index: 2, bssid: 3, channel: 4, txPower: 5, noise: 6, util64: 8, status: 20};
          ARUBA.STATUS = {1: 'up', 2: 'down'};

          // The role gate. Throws unsupported unless this agent is the elected VC.
          ARUBA.requireVc = function (walk) {
              var entry = NE.scalar(walk, ARUBA.VC_IP);
              if (!entry) {
                  throw {unsupported: 'The agent does not expose AI-AP-MIB aiVirtualControllerIPAddress; this is not an Aruba Instant AP.',
                         code: 'not_aruba_instant'};
              }
              if (WE.ipv4(entry) === null) {
                  throw {unsupported: 'This AP is not the elected virtual controller. Only the VC (or the cluster\'s floating AVC address) lists the cluster\'s APs and radios; link this template to the AVC host.',
                         code: 'not_virtual_controller'};
              }
          };

          // {suffix: {column: entry}} for one table, from the columns present in the walk.
          ARUBA.rows = function (walk, base, columns) {
              var out = {}, name, col, cells, suffix;
              for (name in columns) {
                  if (!columns.hasOwnProperty(name)) { continue; }
                  col = columns[name];
                  cells = NE.table(walk, base + '.' + col);
                  for (suffix in cells) {
                      if (!cells.hasOwnProperty(suffix)) { continue; }
                      if (!out.hasOwnProperty(suffix)) { out[suffix] = {}; }
                      out[suffix][name] = cells[suffix];
                  }
              }
              return out;
          };

          // The AP MAC of an aiAccessPointTable row: the MAC column, else the six index arcs.
          ARUBA.apMac = function (row, suffix) {
              return (row.mac ? NE.mac(row.mac) : null) || WE.macFromArcs(suffix.split('.'));
          };

          // The owning AP MAC and radio index of an aiRadioTable row (index: six MAC arcs, then the radio index).
          ARUBA.radioId = function (row, suffix) {
              var arcs = suffix.split('.');
              var mac = (row.apMac ? NE.mac(row.apMac) : null) || WE.macFromArcs(arcs.slice(0, 6));
              var index = row.index ? NE.int(row.index) : (arcs.length === 7 ? parseInt(arcs[6], 10) : null);
              return {mac: mac, index: index !== null && index >= 0 && index <= 255 ? index : null};
          };

          // aiRadioChannel: the first byte is the primary channel; two bits of the second byte are the bonding indicator
          // (0 = 20 MHz, 1 = secondary above, 2 = secondary below, 3 = every width above 40 MHz). 80, 80+80 and 160 MHz
          // cannot be told apart, so the widest class is '80+'.
          ARUBA.channel = function (entry) {
              var v = NE.int(entry);
              if (v === null || v < 0) { return {channel: null, width: null}; }
              var channel = v & 0xFF, bits = (v >> 8) & 3;
              if (channel === 0) { return {channel: null, width: null}; }
              return {channel: channel, width: bits === 0 ? '20' : bits === 3 ? '80+' : '40'};
          };

          // Band from the decoded channel. 6 GHz channel numbers (1 to 233) overlap 2.4 GHz (1 to 14) and 5 GHz (36 to
          // 177), so only channels above 177 prove 6 GHz. On dual-radio APs the sampled fleet put 5 GHz on radio 0 and
          // 2.4 GHz on radio 1; an AP with three or more radios may carry 6 GHz on a channel below 178, so its radios get a
          // band only when the channel proves one.
          ARUBA.band = function (channel, radiosOnAp) {
              if (channel === null) { return null; }
              if (channel >= 178 && channel <= 233) { return '6'; }
              if (radiosOnAp >= 3) { return null; }
              if (channel >= 1 && channel <= 14) { return '2.4'; }
              if (channel >= 32 && channel <= 177) { return '5'; }
              return null;
          };

          ARUBA.device = function (walk, env) {
              var vc = NE.scalar(walk, ARUBA.VC_IP);
              if (!vc) {
                  throw {unsupported: 'The agent does not expose AI-AP-MIB aiVirtualControllerIPAddress; this is not an Aruba Instant AP.',
                         code: 'not_aruba_instant'};
              }
              var address = WE.ipv4(vc);
              var oidEntry = NE.scalar(walk, '1.3.6.1.2.1.1.2.0');
              var objectId = oidEntry ? oidEntry.value.replace(/^\./, '') : null;
              if (objectId !== null && !/^[0-9]+(\.[0-9]+)*$/.test(objectId)) { objectId = null; }
              var descr = WE.blank(NE.text(NE.scalar(walk, '1.3.6.1.2.1.1.1.0')));
              var uptime = NE.int(NE.scalar(walk, NE.UPTIME));
              return [{
                  hostname: WE.blank(NE.text(NE.scalar(walk, '1.3.6.1.2.1.1.5.0'))),
                  description: descr === null ? null : descr.substring(0, 1024),
                  sys_object_id: objectId,
                  vendor: objectId !== null && objectId.indexOf(ARUBA.ENTERPRISE + '.') === 0 ? 'Aruba' : null,
                  platform: 'aruba_instant',
                  role: address !== null ? 'virtual_controller' : 'member',
                  controller_address: address,
                  // The cluster firmware: aiControllerVersion is populated only on the VC.
                  firmware: address !== null ? WE.blank(NE.text(NE.scalar(walk, ARUBA.VERSION))) : null,
                  uptime_s: uptime === null ? null : Math.floor(uptime / 100)
              }];
          };

          ARUBA.apInventory = function (walk, env) {
              ARUBA.requireVc(walk);
              var table = ARUBA.rows(walk, ARUBA.AP, {mac: 1, name: 2, ip: 3, serial: 4, model: 6});
              var out = [], seen = {}, suffix, row, mac;
              for (suffix in table) {
                  if (!table.hasOwnProperty(suffix)) { continue; }
                  row = table[suffix];
                  mac = ARUBA.apMac(row, suffix);
                  if (mac === null) {
                      NE.warning(env, 'ap_identity_missing', 'An AP row had no readable MAC address and was dropped.');
                      continue;
                  }
                  if (seen.hasOwnProperty(mac)) {
                      NE.warning(env, 'ap_identity_duplicate', 'Two AP rows had the same MAC address; both were dropped.');
                      seen[mac].drop = true;
                      continue;
                  }
                  seen[mac] = {
                      ap_uid: WE.apUid(mac), mac_address: mac,
                      name: WE.blank(NE.text(row.name || null)),
                      ip_address: row.ip ? WE.ipv4(row.ip) : null,
                      serial: WE.blank(NE.text(row.serial || null)),
                      model: WE.blank(NE.text(row.model || null)),
                      // AI-AP-MIB has no per-AP firmware column in the walked table; the cluster firmware is on the device.
                      firmware: null
                  };
                  out.push(seen[mac]);
              }
              out = out.filter(function (r) { return !r.drop; });
              return WE.sort(out, ['name', 'mac_address']);
          };

          ARUBA.apState = function (walk, env) {
              ARUBA.requireVc(walk);
              var table = ARUBA.rows(walk, ARUBA.AP, {mac: 1, cpu: 7, memFree: 8, uptime: 9, memTotal: 10, status: 11});
              var out = [], seen = {}, suffix, row, mac, free, total, ticks, used;
              for (suffix in table) {
                  if (!table.hasOwnProperty(suffix)) { continue; }
                  row = table[suffix];
                  mac = ARUBA.apMac(row, suffix);
                  if (mac === null || seen.hasOwnProperty(mac)) {
                      NE.warning(env, mac === null ? 'ap_identity_missing' : 'ap_identity_duplicate',
                          'An AP state row had no unique MAC address and was dropped.');
                      if (mac !== null) { seen[mac].drop = true; }
                      continue;
                  }
                  free = NE.int(row.memFree || null);
                  total = NE.int(row.memTotal || null);
                  // Memory units are not stated by the MIB description the evidence cites; only the ratio is reported.
                  used = free !== null && total !== null && total > 0 && free >= 0 && free <= total
                      ? Math.round((total - free) * 1000 / total) / 10 : null;
                  ticks = NE.int(row.uptime || null);
                  seen[mac] = {
                      ap_uid: WE.apUid(mac),
                      status: ARUBA.STATUS[NE.int(row.status || null)] || 'unknown',
                      uptime_s: ticks === null || ticks < 0 ? null : Math.floor(ticks / 100),
                      cpu_percent: WE.bounded(row.cpu || null, 0, 100),
                      memory_used_percent: used
                  };
                  out.push(seen[mac]);
              }
              out = out.filter(function (r) { return !r.drop; });
              return WE.sort(out, ['ap_uid']);
          };

          ARUBA.radioRows = function (walk, env, columns) {
              var table = ARUBA.rows(walk, ARUBA.RADIO, columns);
              var out = [], seen = {}, perAp = {}, suffix, id, key;
              for (suffix in table) {
                  if (!table.hasOwnProperty(suffix)) { continue; }
                  id = ARUBA.radioId(table[suffix], suffix);
                  if (id.mac === null || id.index === null) {
                      NE.warning(env, 'radio_identity_missing', 'A radio row had no readable AP MAC address or radio index and was dropped.');
                      continue;
                  }
                  key = id.mac + '/' + id.index;
                  if (seen.hasOwnProperty(key)) {
                      NE.warning(env, 'radio_identity_duplicate', 'Two radio rows had the same AP and radio index; both were dropped.');
                      seen[key].drop = true;
                      continue;
                  }
                  seen[key] = {mac: id.mac, index: id.index, row: table[suffix]};
                  out.push(seen[key]);
                  perAp[id.mac] = (perAp[id.mac] || 0) + 1;
              }
              out = out.filter(function (r) { return !r.drop; });
              return {rows: out, perAp: perAp};
          };

          ARUBA.radioInventory = function (walk, env) {
              ARUBA.requireVc(walk);
              var radios = ARUBA.radioRows(walk, env, {apMac: 1, index: 2, bssid: 3}).rows, out = [], i, r;
              for (i = 0; i < radios.length; i++) {
                  r = radios[i];
                  out.push({radio_uid: WE.radioUid(r.mac, r.index), ap_uid: WE.apUid(r.mac), radio_index: r.index,
                            bssid: r.row.bssid ? NE.mac(r.row.bssid) : null});
              }
              return WE.sort(out, ['ap_uid', 'radio_index']);
          };

          ARUBA.radioState = function (walk, env) {
              ARUBA.requireVc(walk);
              var found = ARUBA.radioRows(walk, env, {apMac: 1, index: 2, channel: 4, txPower: 5, noise: 6, util64: 8, status: 20});
              var out = [], i, r, ch, band, noise, power;
              for (i = 0; i < found.rows.length; i++) {
                  r = found.rows[i];
                  ch = ARUBA.channel(r.row.channel || null);
                  band = ARUBA.band(ch.channel, found.perAp[r.mac]);
                  if (ch.channel !== null && band === null) {
                      NE.warning(env, 'radio_band_ambiguous',
                          'A radio channel number does not prove its band (6 GHz channel numbers overlap 2.4 and 5 GHz); its band is unknown.');
                  }
                  noise = WE.bounded(r.row.noise || null, 1, 130);   // A positive magnitude: 94 means -94 dBm.
                  power = WE.bounded(r.row.txPower || null, 0, 40);
                  out.push({
                      radio_uid: WE.radioUid(r.mac, r.index), ap_uid: WE.apUid(r.mac),
                      status: ARUBA.STATUS[NE.int(r.row.status || null)] || 'unknown',
                      band: band, channel: ch.channel, channel_width: ch.width,
                      tx_power_dbm: power, noise_floor_dbm: noise === null ? null : -noise,
                      utilisation_percent: WE.bounded(r.row.util64 || null, 0, 100), utilisation_window_s: 64
                  });
              }
              return WE.sort(out, ['ap_uid', 'radio_uid']);
          };

          // ---------------------------------------------------------------- SSIDs (Phase C)

          ARUBA.SSID = '1.3.6.1.4.1.14823.2.3.3.1.1.7.1';         // aiWlanSSIDEntry, on the VC
          // Simon's template notes: status 0 = broadcasting, 1 = disabled; hide 0 = visible, 1 = hidden. The client count and
          // hide columns are absent on some firmware (6.5.4.11), so a missing column is unknown, never zero or visible.
          ARUBA.SSID_COL = {name: 2, status: 3, clients: 4, hide: 5};

          ARUBA.ssids = function (walk, env) {
              ARUBA.requireVc(walk);
              var table = ARUBA.rows(walk, ARUBA.SSID, ARUBA.SSID_COL);
              var out = [], seen = {}, suffix, row, name, status, hide, clients;
              for (suffix in table) {
                  if (!table.hasOwnProperty(suffix)) { continue; }
                  row = table[suffix];
                  name = WE.blank(NE.text(row.name || null));
                  if (name === null || name.length > 32 * 4) {
                      NE.warning(env, 'ssid_name_missing', 'An SSID row had no readable name and was dropped.');
                      continue;
                  }
                  if (seen.hasOwnProperty(name)) {
                      // Two WLAN profiles may broadcast one SSID name; their counts add up and either enabled one enables it.
                      seen[name].enabled = seen[name].enabled === true || NE.int(row.status || null) === 0 ? true : seen[name].enabled;
                      clients = NE.int(row.clients || null);
                      seen[name].client_count = seen[name].client_count !== null && clients !== null && clients >= 0
                          ? seen[name].client_count + clients : null;
                      // Hidden only when every profile hides it; one visible profile makes the SSID visible.
                      hide = NE.int(row.hide || null);
                      seen[name].hidden = seen[name].hidden === false || hide === 0 ? false
                          : seen[name].hidden === true && hide === 1 ? true : null;
                      seen[name].profiles++;
                      continue;
                  }
                  status = NE.int(row.status || null);
                  hide = NE.int(row.hide || null);
                  clients = NE.int(row.clients || null);
                  seen[name] = {
                      ssid_uid: WE.ssidUid(name), name: name,
                      enabled: status === 0 ? true : status === 1 ? false : null,
                      hidden: hide === 1 ? true : hide === 0 ? false : null,
                      client_count: clients !== null && clients >= 0 ? clients : null,
                      // AI-AP-MIB on Instant exposes no VLAN, authentication or security mode for an SSID; they stay unknown here.
                      vlan_id: null, security: null, profiles: 1
                  };
                  out.push(seen[name]);
              }
              return WE.sort(out, ['name']);
          };

          // ---------------------------------------------------------------- RF neighbours (Phase B)

          ARUBA.INTERFER = '1.3.6.1.4.1.14823.2.3.3.1.1.8.1';      // aiInterferAccessPointEntry: this AP's own detections
          ARUBA.INTERFER_COL = {bssid: 2, ssid: 3, channel: 4, phy: 5, encryption: 6, snr: 7, type: 8};
          // ArubaRogueApType names (the agent prints the label, not the number). Anything else is kept as 'other'.
          ARUBA.ROGUE_TYPES = {valid: 'valid', interfering: 'interfering', unsecure: 'unsecure', dos: 'dos', unknown: 'unknown',
              knowninterfering: 'known_interfering', suspectedunsecure: 'suspected_unsecure',
              '1': 'valid', '2': 'interfering', '3': 'unsecure', '4': 'dos', '5': 'unknown', '6': 'known_interfering',
              '7': 'suspected_unsecure'};
          ARUBA.NEIGHBOUR_LIMIT = 500;

          // aiInterferAPPhyType: "2.4GHz", "5GHz-HE-40", "6GHz-HE-160". The band and, when present, the width suffix.
          ARUBA.phy = function (text) {
              var m = /^(2\.4|5|6)\s*GHz(?:-([A-Za-z]+))?(?:-([0-9]+))?/i.exec(text || '');
              if (!m) { return {band: null, width: null, standard: null}; }
              var width = m[3] && /^(20|40|80|160)$/.test(m[3]) ? m[3] : null;
              return {band: m[1], width: width, standard: m[2] ? m[2].toUpperCase() : null};
          };

          // aiInterferAPChannel: "13", "157+", "56E". The primary channel number only.
          ARUBA.neighbourChannel = function (text) {
              var m = /^\s*([0-9]{1,3})/.exec(text || '');
              var n = m ? parseInt(m[1], 10) : null;
              return n !== null && n >= 1 && n <= 233 ? n : null;
          };

          // The detections of the AP this host points at, deduplicated by BSSID (the strongest kept) and bounded to the
          // strongest ARUBA.NEIGHBOUR_LIMIT; a bounded snapshot says so in a warning. The AP's own classification is kept as
          // it reports it; nothing here calls a detection malicious.
          ARUBA.rfNeighbours = function (walk, env) {
              if (!NE.scalar(walk, ARUBA.VC_IP)) {
                  throw {unsupported: 'The agent does not expose AI-AP-MIB; this is not an Aruba Instant AP.', code: 'not_aruba_instant'};
              }
              var table = ARUBA.rows(walk, ARUBA.INTERFER, ARUBA.INTERFER_COL);
              var best = {}, list = [], suffix, row, bssid, snr, phy, type, raw, key, total = 0;
              for (suffix in table) {
                  if (!table.hasOwnProperty(suffix)) { continue; }
                  row = table[suffix];
                  bssid = row.bssid ? NE.mac(row.bssid) : null;
                  if (bssid === null) {
                      NE.warning(env, 'neighbour_bssid_missing', 'A detection had no readable BSSID and was dropped.');
                      continue;
                  }
                  total++;
                  snr = WE.bounded(row.snr || null, 0, 120);
                  phy = ARUBA.phy(NE.text(row.phy || null));
                  raw = WE.blank(NE.text(row.type || null));
                  key = raw === null ? null : raw.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
                  type = key === null ? null : (ARUBA.ROGUE_TYPES.hasOwnProperty(key) ? ARUBA.ROGUE_TYPES[key] : 'other');
                  // Keep the strongest reading; a reading with no SNR never displaces one that has an SNR.
                  if (best.hasOwnProperty(bssid) && (snr === null || (best[bssid].snr_db !== null && snr <= best[bssid].snr_db))) {
                      continue;
                  }
                  best[bssid] = {
                      bssid: bssid, ssid: WE.blank(NE.text(row.ssid || null)),
                      channel: ARUBA.neighbourChannel(NE.text(row.channel || null)), band: phy.band, channel_width: phy.width,
                      phy: phy.standard, encryption: WE.blank(NE.text(row.encryption || null)), snr_db: snr,
                      classification: type, classification_raw: type === 'other' ? raw.substring(0, 64) : null
                  };
              }
              for (bssid in best) {
                  if (best.hasOwnProperty(bssid)) { list.push(best[bssid]); }
              }
              list.sort(function (a, b) {
                  var x = a.snr_db === null ? -1 : a.snr_db, y = b.snr_db === null ? -1 : b.snr_db;
                  return y - x || (a.bssid < b.bssid ? -1 : 1);
              });
              if (list.length > ARUBA.NEIGHBOUR_LIMIT) {
                  NE.warning(env, 'neighbours_bounded', 'Kept the strongest ' + ARUBA.NEIGHBOUR_LIMIT + ' of ' + list.length
                      + ' distinct BSSIDs (' + total + ' detections).');
                  list = list.slice(0, ARUBA.NEIGHBOUR_LIMIT);
              }
              return list;
          };

          // ---------------------------------------------------------------- clients (Phase F)

          ARUBA.CLIENT = '1.3.6.1.4.1.14823.2.3.3.1.2.4.1';       // aiClientEntry, on the VC
          // Column order from the published AI-AP-MIB. Simon's template confirms 1, 3, 5, 6, 7, 9, 13 and 16 on live
          // clusters; 2 (aiClientWlanMACAddress, the BSSID) and 4 (aiClientAPIPAddress) are read when present and are
          // unknown otherwise.
          ARUBA.CLIENT_COL = {mac: 1, bssid: 2, ip: 3, apIp: 4, name: 5, snr: 7, uptime: 16};
          ARUBA.CLIENT_LIMIT = 4000;

          ARUBA.clients = function (walk, env, policy, key) {
              ARUBA.requireVc(walk);
              var p = WE.clientPolicy(policy, key);
              if (p.requested !== p.policy) {
                  NE.warning(env, 'client_pseudonym_key_missing',
                      'Pseudonymised client IDs need the WE.CLIENT.KEY macro; client identifiers were partially masked instead.');
              }
              if (p.policy !== 'full' && p.key === '') {
