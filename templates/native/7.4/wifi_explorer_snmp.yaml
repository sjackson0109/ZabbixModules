                      ap_uid: WE.apUid(mac),
                      status: ARUBA.STATUS[NE.int(row.status || null)] || 'unknown',
                      uptime_s: ticks === null || ticks < 0 ? null : Math.floor(ticks / 100),
                      cpu_percent: WE.bounded(row.cpu || null, 0, 100),
                      memory_used_percent: used
