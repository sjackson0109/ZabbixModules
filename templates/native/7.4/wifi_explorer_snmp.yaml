    template: Wi-Fi Explorer - Aruba Instant VC by SNMP
    name: Wi-Fi Explorer - Aruba Instant VC by SNMP
    description: Aruba Instant cluster inventory and state from AI-AP-MIB, read from the elected virtual controller. Link it to one host per cluster, pointed at the cluster's floating virtual controller (AVC) address. On a member AP every AP and radio dataset reports unsupported (not_virtual_controller) instead of an empty site. Generated by templates/generate_wifi.py; do not edit by hand. It reads only the host's SNMP interface and carries no credentials.
    vendor:
